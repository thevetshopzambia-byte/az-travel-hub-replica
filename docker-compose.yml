services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aztravelhub-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - aztravelhub-network
    ports:
      - "127.0.0.1:3010:3000"

networks:
  aztravelhub-network:
    driver: bridge
